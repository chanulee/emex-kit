<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emex — Embedding Explorer</title>
<style>
.viz-root{
  color-scheme:light;
  --surface-0:#f3f2ee; --surface-1:#fcfcfb; --line:#dddcd6; --line-strong:#b9b8b0;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#86857f;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --accent:#0b0b0b;
}
@media (prefers-color-scheme: dark){
  .viz-root{
    color-scheme:dark;
    --surface-0:#121211; --surface-1:#1a1a19; --line:#2f2f2d; --line-strong:#4a4a47;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c85;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --accent:#f0efec;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--surface-0);color:var(--text-primary)}
.viz-root{display:grid;grid-template-rows:auto 1fr;height:100vh;background:var(--surface-0)}
header{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface-1)}
header h1{font-size:15px;font-weight:600;margin:0 8px 2px 0;letter-spacing:-.01em}
header h1 span{display:block;font-weight:400;color:var(--text-muted);font-size:11px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl>label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font-size:12px;color:var(--text-secondary)}
.seg button[hidden]{display:none}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--surface-1)}
.seg button:focus-visible{outline:2px solid var(--series-1);outline-offset:-2px}
select{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-1);color:var(--text-primary)}
.kwrap{display:flex;align-items:center;gap:10px}
.kwrap input[type=range]{width:180px;accent-color:var(--accent)}
.kval{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px}
#scree{display:block}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
main.noaside{grid-template-columns:1fr}
main.noaside aside{display:none}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#svg{display:block;width:100%;height:100%}
#axesView{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
aside{border-left:1px solid var(--line);background:var(--surface-1);overflow:auto;padding:16px}
.hint{color:var(--text-muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;max-width:260px;z-index:5}
.tip b{display:block}
.tip span{color:var(--text-secondary)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;font-size:11px;color:var(--text-secondary);background:color-mix(in srgb,var(--surface-0) 85%,transparent);padding:4px 8px;border-radius:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.axlabel{font-size:11px;fill:var(--text-muted)}
.grid{stroke:var(--line);stroke-width:1}
.nb-line{stroke:var(--accent);stroke-width:2;fill:none;opacity:.75}
.nb-rank{font-size:10px;font-weight:600;fill:var(--surface-1)}
.node{cursor:pointer}
.node image{transition:opacity .2s}
.dim .node:not(.on) image{opacity:.18}
.dim .node:not(.on) rect.ring{opacity:.2}
.pc-line{fill:none;stroke-width:1.5;opacity:.45}
.pc-line.on{stroke-width:3;opacity:1}
.dim .pc-line:not(.on){opacity:.08}
/* side panel */
.p-head{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.p-head :is(img,.placeholder){width:84px;border-radius:4px;display:block}
.placeholder, .item-thumb.placeholder{display:inline-grid;place-items:center;background:var(--surface-0);color:var(--text-secondary);font-size:10px;font-weight:600}
.p-head .placeholder{height:84px}
.pole .ims .placeholder{display:grid}
.p-head h2{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
.meta{color:var(--text-secondary);font-size:12px}
.meta a{color:inherit}
.summary{margin:12px 0;color:var(--text-secondary)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:14px}
.gal img{width:100%;border-radius:3px;display:block;aspect-ratio:4/3;object-fit:cover}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:18px 0 8px;font-weight:600}
.nb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb-col h4{margin:0 0 6px;font-size:12px;font-weight:600}
.nb-item{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;margin-bottom:6px;cursor:pointer;font-size:11px;line-height:1.25}
.nb-item :is(img,.placeholder){width:28px;height:39px;object-fit:cover;border-radius:2px}
.nb-item small{color:var(--text-muted);display:block;font-variant-numeric:tabular-nums}
.nb-item:hover{color:var(--series-1)}
table.stab{border-collapse:collapse;width:100%;font-size:11px}
table.stab td,table.stab th{padding:3px 2px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.stab th{color:var(--text-muted);font-weight:500;width:46px}
table.stab tr.cur{background:color-mix(in srgb,var(--series-1) 12%,transparent)}
table.stab .item-thumb{width:24px;height:34px;object-fit:cover;border-radius:2px;margin-right:3px;cursor:pointer;vertical-align:middle}
table.stab .item-thumb.new{outline:2px solid var(--series-2);outline-offset:1px}
/* axes cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:12px}
.card .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.card .top b{font-size:14px}
.card .top span{color:var(--text-muted);font-variant-numeric:tabular-nums}
.card input{flex:1;font:inherit;font-size:12px;border:none;border-bottom:1px dashed var(--line-strong);background:transparent;color:var(--text-primary);padding:2px 0}
.card input:focus{outline:none;border-bottom-color:var(--accent)}
.poles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pole h5{margin:0 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:500}
.pole .ims{display:flex;gap:4px}
.pole .ims div{width:33%;font-size:10px;line-height:1.2;cursor:pointer}
.pole .ims :is(img,.placeholder){width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:3px;display:block;margin-bottom:2px}
.pole:last-child{text-align:right}
.pole:last-child .ims{flex-direction:row-reverse}
.strip{display:block;width:100%;height:34px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:none;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#hud3{position:absolute;left:12px;right:12px;top:10px;display:none;pointer-events:none;font-size:12px}
#hud3 > *{pointer-events:auto}
.h3row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface-1);color:var(--text-secondary)}
.pill[aria-pressed=true]{background:var(--accent);color:var(--surface-1);border-color:var(--accent)}
#comp{margin-top:8px;font-variant-numeric:tabular-nums;color:var(--text-secondary);line-height:1.6;display:inline-block;background:color-mix(in srgb,var(--surface-0) 80%,transparent);padding:2px 6px;border-radius:6px}
#comp b{color:var(--text-primary);display:inline-block;width:16px}
#chips{display:flex;flex-wrap:wrap;gap:3px;max-width:820px}
.chip{width:58px;border:1px solid var(--line);border-radius:5px;background:var(--surface-1);padding:2px 3px 3px;font-size:10px;color:var(--text-muted);user-select:none}
.chip:hover{border-color:var(--line-strong)}
.chip .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:18px;margin-top:3px}
.chip .cell{position:relative;background:var(--line);border-radius:2px;cursor:pointer;display:flex;align-items:flex-end;overflow:hidden}
.chip .cell:hover{outline:1.5px solid var(--accent)}
.chip .cell em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:600;color:var(--text-muted)}
.chip .cell.full em{color:var(--surface-1)}
.chip .bars i{display:block;width:100%;background:var(--accent);border-radius:1px 1px 0 0;min-height:0}
.chip.inview{color:var(--text-primary);border-color:var(--line-strong)}
.h3hint{margin-top:6px;display:inline-block;font-size:11px;color:var(--text-muted);background:color-mix(in srgb,var(--surface-0) 85%,transparent);padding:3px 8px;border-radius:6px;pointer-events:none!important}
#qIn{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-1);color:var(--text-primary);width:220px}
#qStatus{font-size:11px;color:var(--text-muted);max-width:430px;min-height:14px}
#qStatus a{color:var(--series-1)}
.pill.sm{padding:0 6px;font-size:10px}
.qchips{display:flex;flex-wrap:wrap;gap:4px}
.qchip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 4px 2px 9px;font-size:12px;cursor:pointer}
.qchip.on{background:var(--accent);color:var(--surface-1)}
.qchip small{opacity:.6;font-size:9px;margin-right:2px}
.qchip button{all:unset;cursor:pointer;font-size:10px;padding:1px 4px;border-radius:999px;opacity:.75}
.qchip button:hover{opacity:1;background:color-mix(in srgb,currentColor 18%,transparent)}
.qalign{display:flex;flex-direction:column;gap:3px;font-size:12px}
.qalign b{font-variant-numeric:tabular-nums;font-weight:600}
.qrank{font-size:11px}
.qends{display:flex;justify-content:space-between;color:var(--text-muted);margin-bottom:4px}
.qr{display:grid;grid-template-columns:18px 1fr 90px 42px;gap:6px;align-items:center;padding:1px 0;cursor:pointer}
.qr :is(img,.placeholder){width:18px;height:25px;object-fit:cover;border-radius:2px}
.qr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qr .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.qr .v{text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums}
.qr.on,.qr:hover{color:var(--series-1)}
.panel-sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.note{font-size:11px;color:var(--text-muted);margin-top:14px;line-height:1.5}
#optWrap{margin-left:auto;position:relative;align-self:flex-end}
#optPanel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:400px;max-height:70vh;overflow:auto;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:14px;z-index:20;font-size:12px}
#optPanel.open{display:block}
#optPanel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
#optPanel .help{color:var(--text-secondary);line-height:1.55;margin-top:10px}
</style>
<style>
#pinBar{position:absolute;right:12px;bottom:10px;display:none;gap:6px;align-items:center;font-size:12px;background:color-mix(in srgb,var(--surface-0) 88%,transparent);border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;z-index:4;max-width:46%}
#pinBar .pin{display:inline-flex;align-items:center;gap:4px;background:var(--series-2);color:#fff;border-radius:999px;padding:2px 4px 2px 9px;font-weight:600}
#pinBar .pin button{all:unset;cursor:pointer;padding:0 5px;border-radius:999px}
#pinBar .pin button:hover{background:rgba(0,0,0,.2)}
#pinBar small{color:var(--text-muted)}
.cand{font-size:11px;line-height:1.7;color:var(--text-secondary);margin-top:6px}
.cand b{font-weight:600;color:var(--text-primary)}
.cand span{font-variant-numeric:tabular-nums;color:var(--text-muted)}
.lbl-words{color:var(--series-2)}
</style>
</head>
<body>
<div class="viz-root">
<header>
  <h1>emex × EmbeddingGemma 2<span id="datasetInfo"></span></h1>
  <div class="ctl"><label>Dimensions used (k)</label>
    <div class="kwrap"><input type="range" id="k" min="1" step="1"><span class="kval" id="kval"></span><svg id="scree" width="170" height="30" role="img" aria-label="explained variance per axis"></svg></div></div>
  <div class="ctl"><label>View</label>
    <div class="seg" id="viewSeg">
      <button data-v="3d" aria-pressed="true">3D</button>
      <button data-v="2d" aria-pressed="false">2D</button>
      <button data-v="umap" aria-pressed="false">UMAP</button>
      <button data-v="parallel" aria-pressed="false">Parallel</button>
      <button data-v="axes" aria-pressed="false">Axes</button>
    </div></div>
  <div class="ctl"><label>Axis labels</label>
    <div class="seg" id="labelSeg">
      <button data-v="pc" aria-pressed="true">PC numbers</button>
      <button data-v="words" aria-pressed="false">Words</button>
    </div></div>
  <div class="ctl" id="qCtl"><label>Search axes</label>
    <div style="display:flex;gap:4px;align-items:center"><input id="qIn" list="vocabList" placeholder="e.g. speculative vs practical" autocomplete="off">
      <button id="qGo" class="pill">Create axis</button><button id="qPin" class="pill" title="Pin this axis and recompute PCA on the remaining variation">Pin</button></div>
    <div id="qStatus"></div><datalist id="vocabList"></datalist></div>
  <div id="optWrap"><button id="optBtn" class="pill">Options</button>
    <div id="optPanel">
      <div class="row"><span>Embedding space</span><div class="seg" id="spaceSeg">
        <button data-v="combined" aria-pressed="true">Overall</button>
        <button data-v="text" aria-pressed="false">Text</button>
        <button data-v="image" aria-pressed="false">Image</button></div></div>
      <div class="row"><span>Equalize axis scales</span><input type="checkbox" id="eqChk" checked></div>
      <div class="row"><span>Next-axis encoding <span class="meta">(3D and 2D)</span></span><select id="wSel"><option value="none">None</option><option value="size" selected>Size</option><option value="alpha">Opacity</option></select></div>
      <div class="row"><span>Nearest neighbors</span><select id="nbN"><option selected>3</option><option>4</option><option>6</option></select></div>
      <div class="help" id="helpText"></div>
    </div></div>
</header>
<main>
  <div id="stage">
    <svg id="svg"></svg>
    <canvas id="cv"></canvas>
    <div id="hud3">
      <div class="h3row" id="hudBtns">
        <button id="tourBtn" class="pill only3d">Tour</button>
        <button id="spinBtn" class="pill only3d">Spin</button>
        <div id="chips"></div>
        <span id="umapInfo" class="chk"></span>
      </div>
      <div id="comp" style="display:none"></div>
      <div class="h3hint" id="hint"></div>
    </div>
    <div id="pinBar"></div>
    <div id="axesView"></div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
  </div>
  <aside id="panel"></aside>
</main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
// =====================================================================
// state & data
// =====================================================================
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.projects, N = P.length;
const NPC = D.spaces.combined.evr.length, DIM = 768;
const S = {space:'combined', k:Math.min(8,NPC), view:'3d', sel:null, nbN:3, labels:'pc', queries:[], qActive:null, pins:[]};
const KS = D.steps;
const SPACE_NAME = {text:'Text', image:'Image', combined:'Overall'};
const KIND = {text:1, image:2, mixed:3};
const KIND_LABEL = {text:'Text', image:'Image', mixed:'Text and images'};
const NAME_MIN = 0.4;   // |corr| needed before a word is shown as an axis name
const $ = s => document.querySelector(s);
$('#datasetInfo').textContent=`${N} ${N===1?'item':'items'} · ${DIM}-d embeddings · PCA axes`;
$('#k').max=NPC;
$('#k').disabled=NPC===1;
if(!D.spaces.image) $('#spaceSeg [data-v="image"]').hidden=true;
if(N<3) $('#viewSeg [data-v="umap"]').hidden=true;
const axisKey = axis => `emex-axis-${D.id}-${S.space}-${axis}`;
const svg = $('#svg'), NS='http://www.w3.org/2000/svg';
const el = (t,a={},p) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; };
const IDX = [...Array(N).keys()];
const dot=(a,b)=>{ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const thumb = (i, attrs='', classes='') => P[i].thumb
  ? `<img src="${P[i].thumb}" alt="" class="${classes}" ${attrs}>`
  : `<span class="placeholder ${classes}" ${attrs}>${esc(P[i].title.slice(0,2).toUpperCase())}</span>`;

// ---- symmetric eigen-decomposition (cyclic Jacobi) for re-running PCA after pinning
function jacobiEig(A){
  const n=A.length, a=A.map(r=>r.slice()), V=A.map((_,i)=>A.map((_,j)=>i===j?1:0));
  for(let sweep=0; sweep<80; sweep++){
    let off=0; for(let p=0;p<n;p++) for(let q=p+1;q<n;q++) off+=a[p][q]*a[p][q];
    if(off<1e-18) break;
    for(let p=0;p<n;p++) for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-20) continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]), t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<n;k++){ const kp=a[k][p], kq=a[k][q]; a[k][p]=c*kp-s*kq; a[k][q]=s*kp+c*kq; }
      for(let k=0;k<n;k++){ const pk=a[p][k], qk=a[q][k]; a[p][k]=c*pk-s*qk; a[q][k]=s*pk+c*qk; }
      for(let k=0;k<n;k++){ const kp=V[k][p], kq=V[k][q]; V[k][p]=c*kp-s*kq; V[k][q]=s*kp+c*kq; }
    }
  }
  return a.map((r,i)=>[r[i], V.map(row=>row[i])]).sort((x,y)=>y[0]-x[0]);   // [eigenvalue, eigenvector]
}
function gsList(vs){ const out=[]; for(const v0 of vs){ let v=v0.slice(); for(const o of out){ const d=dot(v,o); v=v.map((x,i)=>x-d*o[i]); } const n=Math.hypot(...v); if(n>1e-9) out.push(v.map(x=>x/n)); } return out; }

// =====================================================================
// effective space: original PCs, or [pinned axes + PCA of what is left]
// all coordinates live in the PCA space of the chosen embedding space
// =====================================================================
const EFF = {};
function effFor(space){
  const key = space+'|'+S.pins.map(q=>q.id).join(',');
  if(EFF[key]) return EFF[key];
  const base=D.spaces[space], S0=base.scores;
  let B=null, m=0;
  if(S.pins.length){
    const dirs=gsList(S.pins.map(q=>q.a[space])); m=dirs.length;
    const R=S0.map(r=>{ let v=r.slice(); for(const d of dirs){ const t=dot(v,d); v=v.map((x,i)=>x-t*d[i]); } return v; });
    const C=Array.from({length:NPC},(_,i)=>Array.from({length:NPC},(_,j)=>{ let s=0; for(const r of R) s+=r[i]*r[j]; return s; }));
    const eig=jacobiEig(C).map(e=>e[1]);
    B=gsList([...dirs, ...eig]).slice(0,NPC);
  }
  const scores = B ? S0.map(r=>B.map(b=>dot(r,b))) : S0;
  if(B) for(let j=m;j<NPC;j++){ let mi=0; for(let i=0;i<N;i++) if(Math.abs(scores[i][j])>Math.abs(scores[mi][j])) mi=i; if(scores[mi][j]<0){ for(let i=0;i<N;i++) scores[i][j]*=-1; B[j]=B[j].map(x=>-x); } }
  const tot=S0.reduce((s,r)=>s+dot(r,r),0)||1;
  const evr=Array.from({length:NPC},(_,j)=>scores.reduce((s,r)=>s+r[j]*r[j],0)/tot);
  const sd=Array.from({length:NPC},(_,j)=>Math.sqrt(scores.reduce((s,r)=>s+r[j]*r[j],0)/N)||1e-9);
  // word-list candidates: exact Pearson corr between a term's project scores and each axis's project scores
  // (after pinning, axes are orthogonal directions but their project scores can still correlate)
  const cols = Array.from({length:NPC},(_,j)=>scores.map(r=>r[j]));
  const coln = cols.map(c=>Math.hypot(...c)||1);

  '2d':'Drag to pan · Scroll to cycle Y · Shift+scroll to cycle X · Pinch to zoom',
  'umap':'Drag to pan · Scroll to change k · Pinch to zoom'};
function hit(ev){ const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
  for(let n=T.hits.length-1;n>=0;n--){ const h=T.hits[n]; if(x>=h.x-3&&x<=h.x+h.w+3&&y>=h.y-3&&y<=h.y+h.h+3) return h.i; } return null; }
function zoomAt(f,mx,my){ // 2D/UMAP: keep the point under the cursor fixed
  const W=cv.clientWidth,H=cv.clientHeight, z0=T.zoom2, z1=Math.min(12,Math.max(.35,z0*f));
  const cx=W/2+T.pan2[0], cy=H/2+T.pan2[1];
  T.pan2=[ T.pan2[0]+(mx-cx)*(1-z1/z0), T.pan2[1]+(my-cy)*(1-z1/z0) ]; T.zoom2=z1; kick(); }
function resetView(){ T.cam=CAM0(); T.zoom3=1; T.pan3=[0,0]; T.vel=[0,0]; T.zoom2=1; T.pan2=[0,0]; stopTour(); resetAxes(); kick(); }
const ptrs=new Map(); let drag=null, pinch=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])}; drag=null; return; }
  drag={x:e.clientX,y:e.clientY,moved:0,pan:e.shiftKey||e.button===2}; T.dragging=true; cv.classList.add('drag'); kick(); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); const f=d/(pinch.d||d); pinch.d=d;
    const r=cv.getBoundingClientRect(); if(S.view==='3d'){ T.zoom3=Math.min(5,Math.max(.3,T.zoom3*f)); kick(); } else zoomAt(f,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy); hideTip();
    if(S.view==='3d'){ T.vel=[dx*.008,dy*.008]; T.cam=matMul(matMul(rotY(dx*.008),rotX(dy*.008)),T.cam); }
    else { T.pan2=[T.pan2[0]+dx,T.pan2[1]+dy]; }
    kick(); return; }
  const h=hit(e); if(h!==T.hover){ T.hover=h; kick(); } if(h!==null) showTip(e,h); else hideTip(); });
function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  T.dragging=false; cv.classList.remove('drag');
  if(drag && drag.moved<5){ T.vel=[0,0]; const h=hit(e); if(h!==null) select(h); else if(S.sel!==null){ S.sel=null; render(); } }
  drag=null; }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{ T.hover=null; hideTip(); });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(e.ctrlKey||e.metaKey){ const f=Math.exp(-e.deltaY*.004); if(S.view==='3d'){ T.zoom3=Math.min(5,Math.max(.3,T.zoom3*f)); kick(); } else zoomAt(f,mx,my); return; }
  const horiz=Math.abs(e.deltaX)>Math.abs(e.deltaY);
  const d=(horiz?e.deltaX:e.deltaY)*(e.deltaMode===1?16:1)*.0022;
  if(S.view==='umap'){ T.ukT=Math.min(KS.length-1,Math.max(0,T.ukT+d*1.4)); const kk=KS[Math.round(T.ukT)]; if(kk!==S.k){ S.k=kk; $('#k').value=kk; scree(); renderPanel(); } kick(); return; }
  if(S.view==='3d') walk(e.shiftKey||horiz?'y':'z',d); else walk(e.shiftKey||horiz?'x':'y',d);
},{passive:false});
cv.addEventListener('dblclick',resetView);

$('#eqChk').onchange=e=>{ T.eq=e.target.checked; kick(); };
$('#wSel').onchange=e=>{ T.wenc=e.target.value; kick(); };
document.addEventListener('keydown',e=>{ if(!isCanvas()||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ const d=e.key==='ArrowDown'?.25:-.25; if(S.view==='umap'){ T.ukT=Math.min(KS.length-1,Math.max(1,T.ukT+d*2)); kick(); } else walk(S.view==='3d'?'z':'y',d); e.preventDefault(); }
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ if(S.view!=='umap') walk(S.view==='3d'?'y':'x',e.key==='ArrowRight'?.25:-.25); e.preventDefault(); }
  if(e.key===' '&&S.view==='3d'){ $('#tourBtn').click(); e.preventDefault(); }
  if(e.key==='Escape'){ S.sel=null; render(); } });

function renderParallel(){
  const W=svg.clientWidth, H=svg.clientHeight, padL=40,padR=150,padT=88,padB=60;
  const E=es(), s=E.scores, e=E.evr, k=S.k;
  let m=0; IDX.forEach(i=>{for(let c=0;c<k;c++) m=Math.max(m,Math.abs(s[i][c]));});
  const ax=c=>padL+(k===1?0:c/(k-1))*(W-padL-padR), sy=v=>padT+(.5-v/(2*(m||1)))*(H-padT-padB);
  svg.innerHTML=''; svg.classList.toggle('dim',S.sel!==null);
  const g=el('g',{},svg);
  el('text',{x:16,y:18,class:'axlabel'},g).textContent='Each line is an item. Vertical scales are shared.';
  el('line',{x1:padL,x2:W-padR,y1:sy(0),y2:sy(0),class:'grid','stroke-dasharray':'2 3'},g);
  for(let c=0;c<k;c++){ el('line',{x1:ax(c),x2:ax(c),y1:padT,y2:H-padB,class:'grid',style:c<E.m?'stroke:var(--series-2)':''},g);
    if(k<=20||c%2===0){ el('text',{x:ax(c),y:padT-26,'text-anchor':'middle',class:'axlabel',style:c<E.m?'fill:var(--series-2);font-weight:600':''},g).textContent=baseName(c,E);
      if(S.labels==='words' && k<=12){ const w=userLabel(c,E)||wordName(c,E); if(w) el('text',{x:ax(c),y:padT-12,'text-anchor':'middle',class:'axlabel',style:'fill:var(--series-2);font-size:10px'},g).textContent=w; } }
    if(k<=12) el('text',{x:ax(c),y:padT-40,'text-anchor':'middle',class:'axlabel',style:'font-size:10px'},g).textContent=(e[c]*100).toFixed(1)+'%';
  }
  const nb=S.sel!==null?neighbors(S.space,S.sel,k,S.nbN).map(n=>n[0]):[]; const on=new Set([S.sel,...nb]);
  IDX.filter(i=>!on.has(i)).concat(IDX.filter(i=>on.has(i))).forEach(i=>{
    const y=sy(s[i][0]);
    const d=k===1?`M${ax(0)-5},${y}h10`:s[i].slice(0,k).map((v,c)=>`${c?'L':'M'}${ax(c).toFixed(1)},${sy(v).toFixed(1)}`).join('');
    const isSel=i===S.sel;
    const pth=el('path',{d,class:'pc-line'+(on.has(i)?' on':''),stroke:isSel?'var(--accent)':`var(--series-${KIND[P[i].kind]})`},g); if(isSel) pth.setAttribute('stroke-width',4);
    const h=el('path',{d,fill:'none',stroke:'transparent','stroke-width':10,style:'cursor:pointer'},g);
    h.onmouseenter=ev=>{pth.classList.add('on');showTip(ev,i);}; h.onmousemove=ev=>showTip(ev,i); h.onmouseleave=()=>{ if(!on.has(i)) pth.classList.remove('on'); hideTip(); }; h.onclick=()=>select(i); });
  [...on].filter(i=>i!==null).forEach(i=>{ el('text',{x:ax(k-1)+6,y:sy(s[i][k-1])+4,class:'axlabel',style:'fill:var(--text-primary)'},g).textContent=P[i].title.slice(0,24); });
}
function renderAxes(){
  const v=$('#axesView'), E=es(), s=E.scores, e=E.evr;
  let html=`<div class="cards">`;
  for(let c=0;c<S.k;c++){
    const ord=IDX.slice().sort((a,b)=>s[a][c]-s[b][c]), neg=ord.slice(0,3), pos=ord.slice(-3).reverse();
    const im=i=>`<div data-i="${i}">${thumb(i)}${esc(P[i].title)}</div>`;
    const cd=E.cands[c], fmt=l=>l.map(([t,r])=>`<b>${esc(t)}</b> <span>${r>=0?'+':'−'}${Math.abs(r).toFixed(2)}</span>`).join(' · ');
    const pinned=c<E.m;
    html+=`<div class="card" style="${pinned?'border-color:var(--series-2)':''}"><div class="top"><b>${esc(baseName(c,E))}</b><span>${(e[c]*100).toFixed(1)}%</span>
      ${pinned?`<span style="color:var(--series-2)">Pinned search axis</span>`:(E.m?'':`<input data-c="${c}" placeholder="Name this axis" value="${esc(userLabel(c,E))}">`)}</div>
      ${pinned?'':`<div class="cand">Term correlation ＋ ${fmt(cd.pos.slice(0,3))}<br>Term correlation − ${fmt(cd.neg.slice(0,3))}${wordName(c,E)?'':' <span>(|correlation| < '+NAME_MIN+' · no label)</span>'}</div>`}
      <svg class="strip" data-c="${c}"></svg>
      <div class="poles"><div class="pole"><h5>− end</h5><div class="ims">${neg.map(im).join('')}</div></div>
      <div class="pole"><h5>+ end</h5><div class="ims">${pos.map(im).join('')}</div></div></div>
      ${pinned?'':`<button class="pill sm" data-pinpc="${c}" style="margin-top:8px">Pin the top positive term</button>`}</div>`;
  }
  html+=`</div><p class="note">Terms are ranked by how closely their scores correlate with each PCA axis. The signs of PCA axes are arbitrary.</p>`;
  v.innerHTML=html;
  v.querySelectorAll('input[data-c]').forEach(inp=>inp.oninput=()=>{ try{ localStorage.setItem(axisKey(inp.dataset.c),inp.value); }catch(e){} });
  v.querySelectorAll('.ims div').forEach(d=>d.onclick=()=>select(+d.dataset.i));
  v.querySelectorAll('[data-pinpc]').forEach(b=>b.onclick=async()=>{ const c=+b.dataset.pinpc; const term=E.cands[c].pos[0][0]; $('#qIn').value=term; await runQuery(true); });
  v.querySelectorAll('svg.strip').forEach(st=>{ const c=+st.dataset.c, W=st.clientWidth, H=34; let m=0; IDX.forEach(i=>m=Math.max(m,Math.abs(s[i][c])));
    el('line',{x1:6,x2:W-6,y1:H/2,y2:H/2,class:'grid'},st); el('line',{x1:W/2,x2:W/2,y1:6,y2:H-6,class:'grid'},st);
    IDX.forEach(i=>{ const x=6+(.5+s[i][c]/(2*(m||1)))*(W-12), isS=i===S.sel;
      const ci=el('circle',{cx:x,cy:H/2,r:isS?7:5,fill:isS?'var(--accent)':`var(--series-${KIND[P[i].kind]})`,stroke:'var(--surface-1)','stroke-width':2,style:'cursor:pointer'},st);
      ci.onmouseenter=ev=>showTip(ev,i); ci.onmousemove=ev=>showTip(ev,i); ci.onmouseleave=hideTip; ci.onclick=()=>select(i); }); });
}

// =====================================================================
// search axes: text → EmbeddingGemma 2 → direction in PC space; pin → re-run PCA on the rest
// =====================================================================
const MODEL_ID='onnx-community/embeddinggemma-2-ONNX', TJS='https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/dist/transformers.min.js';
const b64f=s=>{ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new Float32Array(u.buffer); };
const BASIS={}; for(const k in D.spaces) BASIS[k]={Vt:b64f(D.spaces[k].Vt), mean:b64f(D.spaces[k].mean)};
const VOCAB=new Map(D.vocab.map((t,i)=>[t.toLowerCase(),i]));
let QID=0, MODEL=null, modelLoading=null;
function qStatus(h){ $('#qStatus').innerHTML=h; }
async function loadModel(){
  if(MODEL) return MODEL;
  if(!modelLoading) modelLoading=(async()=>{
    let gpu=false; try{ gpu=!!(navigator.gpu && await navigator.gpu.requestAdapter()); }catch(e){}
    // the q4/q8 ONNX graphs use GatherBlockQuantized, which the WASM backend lacks → free text needs WebGPU
    if(!gpu) throw new Error('NO_WEBGPU');
    qStatus('Loading the query model…');
    const Tj=await import(TJS); const prog={};
    const onp=p=>{ if(p.status==='progress'&&p.total){ prog[p.file]=[p.loaded,p.total]; const l=Object.values(prog).reduce((a,b)=>a+b[0],0), t=Object.values(prog).reduce((a,b)=>a+b[1],0);
      qStatus(`Downloading model ${(100*l/t).toFixed(0)}% · ${(l/1e6).toFixed(0)} / ${(t/1e6).toFixed(0)} MB`); } };
    const config=await Tj.AutoConfig.from_pretrained(MODEL_ID); config.vision_config=config.audio_config=null;
    const model=await Tj.AutoModel.from_pretrained(MODEL_ID,{config,device:'webgpu',dtype:'q4',progress_callback:onp});
    const tok=await Tj.AutoTokenizer.from_pretrained(MODEL_ID);
    MODEL={model,tok}; return MODEL;
  })().catch(e=>{ modelLoading=null; throw e; });
  return modelLoading;
}
async function embedQuery(text){ const {model,tok}=await loadModel(); const {sentence_embedding:e}=await model(await tok(['task: search result | query: '+text]));
  const v=Float32Array.from(e.data); const n=Math.hypot(...v); return v.map(x=>x/n); }
function projFromEmb(q){ const a={},c={}; for(const k in BASIS){ const {Vt,mean}=BASIS[k];
  a[k]=Array.from({length:NPC},(_,p)=>{ let s=0; for(let d=0;d<DIM;d++) s+=Vt[p*DIM+d]*q[d]; return s; }); let m=0; for(let d=0;d<DIM;d++) m+=mean[d]*q[d]; c[k]=m; } return {a,c}; }
async function termVec(t){ const i=VOCAB.get(t.trim().toLowerCase());
  if(i!==undefined){ const a={},c={}; for(const k in D.spaces){ a[k]=D.spaces[k].vocab_a[i]; c[k]=D.spaces[k].vocab_c[i]; } return {a,c,src:'Vocabulary'}; }
  return {...projFromEmb(await embedQuery(t.trim())),src:'Model'}; }
function suggest(t){ const s=t.trim().toLowerCase(), ch=new Set(s.replace(/\s/g,''));
  return D.vocab.map(v=>[v,[...v.toLowerCase()].filter(x=>ch.has(x)).length/Math.max(3,v.length)+(v.toLowerCase().includes(s)||s.includes(v.toLowerCase())?1:0)]).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]); }
async function makeQuery(text){
  const parts=text.split(/\s+(?:vs\.?|↔|<->)\s+/i).map(x=>x.trim()).filter(Boolean).slice(0,2);
  const vs=[]; for(const p of parts) vs.push(await termVec(p));
  const a={},c={}; for(const k in D.spaces){ a[k]=vs[0].a[k].map((v,i)=>v-(vs[1]?vs[1].a[k][i]:0)); c[k]=vs[0].c[k]-(vs[1]?vs[1].c[k]:0); }
  return {id:QID++, pos:parts[0], neg:parts[1]||null, label:parts.join(' ↔ '), a, c, src:[...new Set(vs.map(v=>v.src))].join('+')};
}
async function runQuery(pin=false){
  const text=$('#qIn').value.trim(); if(!text) return;
  const target='x';
  try{
    let q=S.queries.find(x=>x.label===text.split(/\s+(?:vs\.?|↔|<->)\s+/i).map(x=>x.trim()).filter(Boolean).slice(0,2).join(' ↔ '));
    if(!q){ q=await makeQuery(text); S.queries.unshift(q); if(S.queries.length>10) S.queries.pop(); }
    S.qActive=q.id;
    if(pin){ if(pinQuery(q)===false) return; } else applyQuery(q,target);
    qStatus(`‘${esc(q.label)}’ → ${pin?'Pin':target.toUpperCase()+' axis'} · ${q.src}`);
  }catch(e){
    console.warn(e);
    const why=String(e&&e.message).includes('NO_WEBGPU')?'Free-text queries require WebGPU.':'The browser could not load or run the model.';
    qStatus(`${why} Try a built-in term. ${suggest(text).map(w=>`<a href="#" data-w="${esc(w)}">${esc(w)}</a>`).join(' · ')}`);
    document.querySelectorAll('#qStatus a[data-w]').forEach(a=>a.onclick=ev=>{ ev.preventDefault(); $('#qIn').value=a.dataset.w; runQuery(pin); });
  }
}
function applyQuery(q,target){
  stopTour(); if(S.view==='2d' && target==='z') target='y';
  T.q[target]=q; S.qActive=q.id; if(!isCanvas()){ S.view='3d'; syncSeg('viewSeg','3d'); }
  render(); kick();
}
function pinQuery(q){ if(S.pins.some(p=>p.id===q.id)) return; if(S.pins.length>=Math.min(3,NPC)){ qStatus('Unpin an axis to make room for another.'); return false; } S.pins.push(q); pinsChanged(); return true; }
function unpin(id){ S.pins=S.pins.filter(p=>p.id!==id); pinsChanged(); }
function pinsChanged(){ resetAxes(); T.rows=null; T.kk=0; render(); kick(); }
function syncSeg(id,v){ document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); }
const qById=id=>S.queries.find(q=>q.id===id);
function qScore(q,i){ const a=aEff(q), s=es().scores[i]; let v=q.c[S.space]; for(let c=0;c<NPC;c++) v+=a[c]*s[c]; return v; }
function qShare(q,k){ const a=aEff(q); let t=0,p=0; a.forEach((v,c)=>{t+=v*v; if(c<k) p+=v*v;}); return Math.sqrt(p/(t||1)); }
function queryPanel(){
  if(!S.queries.length) return '';
  const q=qById(S.qActive)||S.queries[0], E=es();
  let h=`<h3 style="margin-top:0">Search axes</h3><div class="qchips">`+S.queries.map(x=>`<span class="qchip ${x.id===q.id?'on':''}" data-q="${x.id}">${S.pins.some(p=>p.id===x.id)?'Pinned · ':''}${esc(x.label)}<small>${x.src}</small>
    <button data-qa="${x.id}:x">X</button><button data-qa="${x.id}:y">Y</button><button data-qa="${x.id}:z">Z</button><button data-qpin="${x.id}" title="Pin this axis and recompute PCA">${S.pins.some(p=>p.id===x.id)?'Unpin':'Pin'}</button><button data-qx="${x.id}" title="Remove">×</button></span>`).join('')+`</div>`;
  const a=aEff(q), na=Math.hypot(...a)||1;
  const al=a.map((v,c)=>[v/na,c]).sort((x,y)=>Math.abs(y[0])-Math.abs(x[0])).slice(0,4);
  h+=`<p class="meta" style="margin:8px 0 4px">Current axis contributions for “${esc(q.label)}” (${SPACE_NAME[S.space]}):</p><div class="qalign">`+
    al.map(([v,c])=>`<span>${esc(axName(c,E))} <b>${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}</b>${E.m?'':` <button class="pill sm" data-name="${c}:${v>=0?'+':'−'}">Use as label</button>`}</span>`).join('')+`</div>`;
  h+=`<p class="meta" style="margin:4px 0 8px">The first ${S.k} axes capture ${(qShare(q,S.k)*100).toFixed(0)}% of this direction.</p>`;
  const ranked=IDX.map(i=>[i,qScore(q,i)]).sort((x,y)=>y[1]-x[1]), mn=ranked[ranked.length-1][1], mx=ranked[0][1];
  h+=`<div class="qrank"><div class="qends"><span>${esc(q.pos)} ↑</span><span>${q.neg?esc(q.neg)+' ↓':'less '+esc(q.pos)+' ↓'}</span></div>`+ranked.map(([i,v],r)=>`<div class="qr ${i===S.sel?'on':''}" data-i="${i}">${thumb(i)}<span class="t">${r+1}. ${esc(P[i].title)}</span><span class="bar"><i style="width:${(100*(v-mn)/((mx-mn)||1)).toFixed(1)}%"></i></span><span class="v">${v.toFixed(3)}</span></div>`).join('')+`</div>`;
  return h;
}
function bindQueryPanel(root){
  root.querySelectorAll('[data-q]').forEach(e=>e.onclick=ev=>{ if(ev.target.tagName==='BUTTON') return; S.qActive=+e.dataset.q; render(); });
  root.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{ const [id,t]=b.dataset.qa.split(':'); applyQuery(qById(+id),t); });
  root.querySelectorAll('[data-qpin]').forEach(b=>b.onclick=()=>{ const q=qById(+b.dataset.qpin); if(S.pins.some(p=>p.id===q.id)) unpin(q.id); else pinQuery(q); });
  root.querySelectorAll('[data-qx]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.qx; S.queries=S.queries.filter(q=>q.id!==id);
    for(const k of ['x','y','z']) if(T.q[k]&&T.q[k].id===id) T.q[k]=null;
    if(S.pins.some(p=>p.id===id)){ unpin(id); } if(S.qActive===id) S.qActive=S.queries[0]?.id??null; render(); kick(); });
  root.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{ const [c,sg]=b.dataset.name.split(':'), q=qById(S.qActive)||S.queries[0];
    try{ localStorage.setItem(axisKey(c),`${sg} ${q.label}`); }catch(e){} b.textContent='Saved'; });
}

// =====================================================================
function select(i){ S.sel=S.sel===i?null:i; render(); }
function nbItem(j,d){ return `<div class="nb-item" data-i="${j}">${thumb(j)}<div>${esc(P[j].title)}<small>d = ${d.toFixed(3)}</small></div></div>`; }
$('#helpText').innerHTML=`<h3 style="margin-top:0">Controls</h3>
    <p><b>Dimensions (k)</b> sets how many axes are used to compare items. Click an item to see its neighbors.</p>
    <p><b>3D and 2D</b> let you rotate through axes with the scroll wheel. Click X, Y, or Z on an axis chip to assign it directly. In 3D, <b>Tour</b> rotates through the first k axes.</p>
    <p><b>UMAP</b> groups nearby items in 2D. Scroll to change the number of axes used.</p>
    <p><b>Search axes</b> rank items along a term or phrase. Enter “A vs B” to compare two terms. <b>Pin</b> keeps that direction and recomputes PCA on the remaining variation.</p>`;
function renderPanel(){
  const a=$('#panel'), qp=queryPanel(), E=es();
  const show = S.sel!==null || S.queries.length>0;
  const mainEl=document.querySelector('main'); if(mainEl.classList.contains('noaside')===show){ mainEl.classList.toggle('noaside',!show); requestAnimationFrame(()=>{ if(isCanvas()) draw(); }); }
  if(S.sel===null){
    a.innerHTML=qp; bindQueryPanel(a); return;
  }
  const p=P[S.sel];
  let h=`<div class="p-head">${thumb(S.sel)}<div><h2>${esc(p.title)}</h2><div class="meta">${KIND_LABEL[p.kind]}</div></div></div>
  <p class="summary">${esc(p.summary)}${p.summary.length===420?'…':''}</p>`;
  if(p.gallery.length) h+=`<div class="gal">${p.gallery.map(g=>`<img src="${g}" alt="">`).join('')}</div>`;
  h+=`<h3>Nearest items · k = ${S.k}${E.m?' · including pinned axes':''}</h3><div class="nb">`;
  for(const spc of Object.keys(D.spaces)) h+=`<div class="nb-col"><h4 style="${spc===S.space?'text-decoration:underline':''}">${SPACE_NAME[spc]}</h4>${neighbors(spc,S.sel,S.k,S.nbN).map(([j,d])=>nbItem(j,d)).join('')}</div>`;
  h+=`</div><h3>Neighbors by dimension count · ${SPACE_NAME[S.space]}</h3><table class="stab">`;
  let prev=null;
  for(const kk of KS){ const nb=neighbors(S.space,S.sel,kk,S.nbN).map(n=>n[0]);
    h+=`<tr class="${kk===S.k?'cur':''}"><th>k=${kk}${kk===NPC?' (all)':''}</th><td>${nb.map(j=>thumb(j,`data-i="${j}" title="${esc(P[j].title)}"`, `item-thumb ${prev&&!prev.includes(j)?'new':''}`)).join('')}</td></tr>`; prev=nb; }
  h+=`</table><p class="note">Orange outlines mark new neighbors compared with the preceding row.</p><h3>Item rank on the first ${Math.min(S.k,10)} axes</h3><table class="stab">`;
  for(let c=0;c<Math.min(S.k,10);c++){ const ord=IDX.slice().sort((x,y)=>E.scores[x][c]-E.scores[y][c]), r=ord.indexOf(S.sel);
    h+=`<tr><th style="width:auto;white-space:nowrap">${esc(axName(c,E))}</th><td><svg width="130" height="12"><line x1="2" x2="128" y1="6" y2="6" stroke="var(--line-strong)"/><circle cx="${2+126*r/(Math.max(1,N-1))}" cy="6" r="4.5" fill="var(--accent)"/></svg> <span class="meta">${r+1}/${N}</span></td></tr>`; }
  h+=`</table>`;
  if(qp) h+='<hr class="panel-sep">'+qp;
  a.innerHTML=h; bindQueryPanel(a);
  a.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>select(+x.dataset.i));
}

// =====================================================================
// render
// =====================================================================
function render(){
  scree(); legend(); pinBar();
  const canvas=isCanvas();
  $('#axesView').style.display=S.view==='axes'?'block':'none';
  svg.style.display=S.view==='parallel'?'block':'none';
  cv.style.display=$('#hud3').style.display=canvas?'block':'none';
  if(canvas){
    document.querySelectorAll('#hudBtns .only3d').forEach(b=>b.style.display=S.view==='3d'?'':'none');
    document.querySelectorAll('#hudBtns .noumap').forEach(b=>b.style.display=S.view==='umap'?'none':'');
    $('#chips').style.display=S.view==='umap'?'none':'flex';
    $('#hint').innerHTML=HINT[S.view];
    if(S.view==='umap'){ T.ukT=KS.reduce((bi,v,i)=>Math.abs(v-S.k)<Math.abs(KS[bi]-S.k)?i:bi,0); S.k=KS[T.ukT]; $('#k').value=S.k; scree(); }
    if(S.view!=='3d') stopTour();
    buildChips(); kick(); draw();
  } else if(S.view==='parallel') renderParallel(); else renderAxes();
  renderPanel();
}
addEventListener('resize',()=>{ if(isCanvas()) draw(); else render(); });
$('#k').value=S.k; render();
</script>
</body>
</html>
